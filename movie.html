<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Party</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000;
    }

    video {
      width: 100%;
      max-height: 600px;
      background: #000;
      display: block;
    }

    /*
     * Viewer mute button.
     */
    #muteButton {
      display: none;

      position: absolute;
      right: 15px;
      bottom: 15px;

      width: 46px;
      height: 46px;

      border: none;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.75);
      color: #fff;

      font-size: 22px;

      cursor: pointer;

      z-index: 10;
    }

    #muteButton:hover {
      background: rgba(0, 0, 0, 0.9);
    }

    .info {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .status,
    .viewers,
    .role {
      padding: 10px 14px;
      background: #222;
      border-radius: 6px;
      font-size: 14px;
    }

    .connected {
      color: #4caf50;
    }

    .disconnected {
      color: #f44336;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Watch Party</h1>

    <div class="video-container">

      <video
        id="video"
        controls
        autoplay
        muted
        playsinline
      >
        <source
          src="https://coderhub.s3.ir-thr-at1.arvanstorage.ir/621b9bbd91f4f19ec8ad3fc88247421272733062-480p.mp4"
          type="video/mp4"
        >
      </video>

      <!-- Viewer mute/unmute button -->
      <button
        id="muteButton"
        type="button"
        aria-label="Unmute"
      >
        🔇
      </button>

    </div>

    <div class="info">

      <div
        id="status"
        class="status disconnected"
      >
        Connecting...
      </div>

      <div
        id="viewers"
        class="viewers"
      >
        👁 0 viewers
      </div>

      <div
        id="role"
        class="role"
      >
        Role: Viewer
      </div>

    </div>

  </div>

  <script>
    const video =
      document.getElementById("video");

    const status =
      document.getElementById("status");

    const viewers =
      document.getElementById("viewers");

    const roleElement =
      document.getElementById("role");

    const muteButton =
      document.getElementById("muteButton");

    /*
     * WebSocket protocol.
     */
    const wsProtocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    /*
     * Get Host token from URL.
     */
    const pageUrl =
      new URL(window.location.href);

    const hostToken =
      pageUrl.searchParams.get("token");

    /*
     * Build WebSocket URL.
     */
    let wsUrl =
      `${wsProtocol}//movie.mrjavan.workers.dev`;

    if (hostToken) {
      wsUrl +=
        `?token=${encodeURIComponent(hostToken)}`;
    }

    let socket = null;

    /*
     * Current user's role.
     */
    let isHost = false;

    /*
     * Prevent local video events from
     * being sent while applying server state.
     */
    let applyingRemoteState = false;

    /*
     * Ignore seek events caused by
     * synchronization.
     */
    let ignoreNextSeek = false;

    /*
     * Prevent local events before
     * receiving the initial server state.
     */
    let initialStateReceived = false;

    /*
     * Latest server state.
     */
    let lastServerState = null;

    /*
     * Check if video is ready.
     */
    function videoIsReady() {

      return video.readyState >= 3;
    }

    /*
     * Update role UI.
     */
    function updateControls() {

      if (isHost) {

        /*
         * Host gets normal video controls.
         */
        video.controls = true;

        /*
         * Viewer mute button is hidden.
         */
        muteButton.style.display =
          "none";

        roleElement.textContent =
          "Role: Host";

      } else {

        /*
         * Viewer does not get
         * Play/Pause/Seek controls.
         */
        video.controls = false;

        /*
         * Viewer gets only mute/unmute.
         */
        muteButton.style.display =
          "block";

        roleElement.textContent =
          "Role: Viewer";

        updateMuteButton();
      }
    }

    /*
     * Update mute button icon.
     */
    function updateMuteButton() {

      if (video.muted) {

        muteButton.textContent =
          "🔇";

        muteButton.setAttribute(
          "aria-label",
          "Unmute"
        );

      } else {

        muteButton.textContent =
          "🔊";

        muteButton.setAttribute(
          "aria-label",
          "Mute"
        );
      }
    }

    /*
     * Viewer mute/unmute.
     *
     * This is completely local and
     * is not sent to the server.
     */
    muteButton.addEventListener(
      "click",
      () => {

        video.muted =
          !video.muted;

        updateMuteButton();
      }
    );

    /*
     * Apply the latest server state.
     */
    async function applyServerState() {

      if (!lastServerState) {
        return;
      }

      if (!videoIsReady()) {
        return;
      }

      const playing =
        lastServerState.playing;

      const position =
        lastServerState.position;

      applyingRemoteState = true;

      /*
       * Synchronize position.
       */
      if (
        Math.abs(
          video.currentTime - position
        ) > 0.5
      ) {

        ignoreNextSeek = true;

        video.currentTime =
          position;
      }

      /*
       * Synchronize playback.
       */
      if (playing) {

        /*
         * Viewers need muted autoplay.
         */
        if (!isHost) {

          /*
           * Only force mute if the viewer
           * has not manually enabled sound yet.
           */
          if (
            !initialStateReceived
          ) {
            video.muted = true;
          }
        }

        try {

          await video.play();

        } catch (error) {

          console.log(
            "Autoplay was blocked."
          );
        }

      } else {

        video.pause();
      }

      initialStateReceived = true;

      applyingRemoteState = false;

      updateMuteButton();
    }

    /*
     * Video became ready.
     */
    video.addEventListener(
      "canplay",
      () => {

        if (!lastServerState) {
          return;
        }

        applyServerState();
      }
    );

    /*
     * Metadata loaded.
     */
    video.addEventListener(
      "loadedmetadata",
      () => {

        if (!lastServerState) {
          return;
        }

        applyServerState();
      }
    );

    /*
     * Connect to Watch Party server.
     */
    function connect() {

      socket =
        new WebSocket(wsUrl);

      socket.addEventListener(
        "open",
        () => {

          status.textContent =
            "Connected";

          status.className =
            "status connected";
        }
      );

      socket.addEventListener(
        "close",
        () => {

          status.textContent =
            "Disconnected - reconnecting...";

          status.className =
            "status disconnected";

          initialStateReceived = false;

          setTimeout(
            connect,
            2000
          );
        }
      );

      socket.addEventListener(
        "error",
        () => {

          status.textContent =
            "Connection error";

          status.className =
            "status disconnected";
        }
      );

      socket.addEventListener(
        "message",
        async (event) => {

          try {

            const data =
              JSON.parse(event.data);

            /*
             * Role message.
             */
            if (
              data.type === "role"
            ) {

              isHost =
                data.isHost === true;

              updateControls();

              if (lastServerState) {
                applyServerState();
              }

              return;
            }

            /*
             * Viewer count.
             */
            if (
              data.type === "viewers"
            ) {

              const count =
                Number(data.count);

              viewers.textContent =
                `👁 ${count} ${
                  count === 1
                    ? "viewer"
                    : "viewers"
                }`;

              return;
            }

            /*
             * Movie state.
             */
            if (
              data.type !== "state"
            ) {
              return;
            }

            /*
             * Save server state.
             */
            lastServerState = {
              playing:
                data.playing === true,

              position:
                Number(data.position)
            };

            /*
             * Apply immediately if possible.
             */
            await applyServerState();

          } catch (error) {

            console.error(
              "Invalid server message:",
              error
            );

            applyingRemoteState = false;
          }
        }
      );
    }

    /*
     * Host Play.
     */
    video.addEventListener(
      "play",
      () => {

        if (!initialStateReceived) {
          return;
        }

        if (!isHost) {
          return;
        }

        if (
          applyingRemoteState ||
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }

        socket.send(
          JSON.stringify({
            type: "play",
            position:
              video.currentTime
          })
        );
      }
    );

    /*
     * Host Pause.
     */
    video.addEventListener(
      "pause",
      () => {

        if (!initialStateReceived) {
          return;
        }

        if (!isHost) {
          return;
        }

        if (
          applyingRemoteState ||
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }

        socket.send(
          JSON.stringify({
            type: "pause",
            position:
              video.currentTime
          })
        );
      }
    );

    /*
     * Host Seek.
     */
    video.addEventListener(
      "seeked",
      () => {

        if (!initialStateReceived) {
          return;
        }

        if (!isHost) {
          return;
        }

        if (applyingRemoteState) {
          return;
        }

        if (ignoreNextSeek) {

          ignoreNextSeek = false;

          return;
        }

        if (
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }

        socket.send(
          JSON.stringify({
            type: "seek",
            position:
              video.currentTime
          })
        );
      }
    );

    /*
     * Initialize UI.
     */
    updateControls();

    updateMuteButton();

    /*
     * Connect.
     */
    connect();
  </script>

</body>
