<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Party</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      max-height: 600px;
      background: #000;
      display: block;
    }

    .info {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .status,
    .viewers,
    .role {
      padding: 10px 14px;
      background: #222;
      border-radius: 6px;
      font-size: 14px;
    }

    .connected {
      color: #4caf50;
    }

    .disconnected {
      color: #f44336;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Watch Party</h1>

    <video
      id="video"
      controls
      autoplay
      muted
      playsinline
    >
      <source
        src="https://coderhub.s3.ir-thr-at1.arvanstorage.ir/621b9bbd91f4f19ec8ad3fc88247421272733062-480p.mp4"
        type="video/mp4"
      >
    </video>

    <div class="info">

      <div
        id="status"
        class="status disconnected"
      >
        Connecting...
      </div>

      <div
        id="viewers"
        class="viewers"
      >
        👁 0 viewers
      </div>

      <div
        id="role"
        class="role"
      >
        Role: Viewer
      </div>

    </div>

  </div>

  <script>
    const video =
      document.getElementById("video");

    const status =
      document.getElementById("status");

    const viewers =
      document.getElementById("viewers");

    const roleElement =
      document.getElementById("role");

    /*
     * WebSocket protocol.
     */
    const wsProtocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    /*
     * Get Host token from URL.
     */
    const pageUrl =
      new URL(window.location.href);

    const hostToken =
      pageUrl.searchParams.get("token");

    /*
     * Build WebSocket URL.
     */
    let wsUrl =
      `${wsProtocol}//movie.mrjavan.workers.dev`;

    if (hostToken) {
      wsUrl +=
        `?token=${encodeURIComponent(hostToken)}`;
    }

    let socket = null;

    /*
     * Current user's role.
     */
    let isHost = false;

    /*
     * Prevent local events from being
     * sent while applying server state.
     */
    let applyingRemoteState = false;

    /*
     * Prevent synchronized seek events
     * from being sent back to the server.
     */
    let ignoreNextSeek = false;

    /*
     * Prevent local events before
     * receiving the initial server state.
     */
    let initialStateReceived = false;

    /*
     * Store the latest server state.
     *
     * This is important when the WebSocket
     * state arrives before the video is ready.
     */
    let lastServerState = null;

    /*
     * Check whether the video is ready
     * enough for playback.
     */
    function videoIsReady() {

      return (
        video.readyState >= 3
      );
    }

    /*
     * Update controls based on role.
     */
    function updateControls() {

      if (isHost) {

        video.controls = true;

        roleElement.textContent =
          "Role: Host";

      } else {

        video.controls = false;

        roleElement.textContent =
          "Role: Viewer";
      }
    }

    /*
     * Apply the latest server state.
     */
    async function applyServerState() {

      if (!lastServerState) {
        return;
      }

      const playing =
        lastServerState.playing;

      const position =
        lastServerState.position;

      /*
       * If the video is not ready yet,
       * wait for canplay.
       */
      if (!videoIsReady()) {
        return;
      }

      applyingRemoteState = true;

      /*
       * Synchronize position.
       */
      if (
        Math.abs(
          video.currentTime - position
        ) > 0.5
      ) {

        ignoreNextSeek = true;

        try {
          video.currentTime = position;
        } catch (error) {
          console.log(
            "Unable to set video position."
          );
        }
      }

      /*
       * Synchronize playback.
       */
      if (playing) {

        /*
         * Viewers use muted autoplay.
         */
        if (!isHost) {
          video.muted = true;
        }

        try {

          await video.play();

        } catch (error) {

          console.log(
            "Playback will retry when video is ready."
          );

        }

      } else {

        video.pause();
      }

      initialStateReceived = true;

      applyingRemoteState = false;
    }

    /*
     * When the video becomes ready,
     * apply the latest server state again.
     *
     * This fixes the problem where a Viewer
     * joins while the movie is already playing.
     */
    video.addEventListener(
      "canplay",
      () => {

        if (!lastServerState) {
          return;
        }

        applyServerState();
      }
    );

    /*
     * Also retry after metadata is loaded.
     */
    video.addEventListener(
      "loadedmetadata",
      () => {

        if (!lastServerState) {
          return;
        }

        applyServerState();
      }
    );

    /*
     * Connect to Watch Party server.
     */
    function connect() {

      socket =
        new WebSocket(wsUrl);

      socket.addEventListener(
        "open",
        () => {

          status.textContent =
            "Connected";

          status.className =
            "status connected";
        }
      );

      socket.addEventListener(
        "close",
        () => {

          status.textContent =
            "Disconnected - reconnecting...";

          status.className =
            "status disconnected";

          initialStateReceived = false;

          setTimeout(
            connect,
            2000
          );
        }
      );

      socket.addEventListener(
        "error",
        () => {

          status.textContent =
            "Connection error";

          status.className =
            "status disconnected";
        }
      );

      socket.addEventListener(
        "message",
        async (event) => {

          try {

            const data =
              JSON.parse(event.data);

            /*
             * Role update.
             */
            if (
              data.type === "role"
            ) {

              isHost =
                data.isHost === true;

              updateControls();

              /*
               * Role can arrive before or after
               * the state, so try synchronization
               * again after receiving the role.
               */
              if (lastServerState) {
                applyServerState();
              }

              return;
            }

            /*
             * Viewer count update.
             */
            if (
              data.type === "viewers"
            ) {

              const count =
                Number(data.count);

              viewers.textContent =
                `👁 ${count} ${
                  count === 1
                    ? "viewer"
                    : "viewers"
                }`;

              return;
            }

            /*
             * Movie state update.
             */
            if (
              data.type !== "state"
            ) {
              return;
            }

            /*
             * Save the state first.
             *
             * Do not immediately depend on
             * the video being ready.
             */
            lastServerState = {
              playing:
                data.playing === true,

              position:
                Number(data.position)
            };

            /*
             * Try to apply immediately.
             *
             * If the video isn't ready,
             * canplay/loadedmetadata will
             * apply it later.
             */
            await applyServerState();

          } catch (error) {

            console.error(
              "Invalid server message:",
              error
            );

            applyingRemoteState = false;
          }
        }
      );
    }

    /*
     * Host Play.
     */
    video.addEventListener(
      "play",
      () => {

        if (!initialStateReceived) {
          return;
        }

        /*
         * Viewers never send control commands.
         */
        if (!isHost) {
          return;
        }

        if (
          applyingRemoteState ||
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }

        socket.send(
          JSON.stringify({
            type: "play",
            position:
              video.currentTime
          })
        );
      }
    );

    /*
     * Host Pause.
     */
    video.addEventListener(
      "pause",
      () => {

        if (!initialStateReceived) {
          return;
        }

        /*
         * Viewers never send control commands.
         */
        if (!isHost) {
          return;
        }

        if (
          applyingRemoteState ||
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }

        socket.send(
          JSON.stringify({
            type: "pause",
            position:
              video.currentTime
          })
        );
      }
    );

    /*
     * Host Seek.
     *
     * Seeking pauses the movie for everyone.
     */
    video.addEventListener(
      "seeked",
      () => {

        if (!initialStateReceived) {
          return;
        }

        /*
         * Viewers cannot seek.
         */
        if (!isHost) {
          return;
        }

        if (applyingRemoteState) {
          return;
        }

        if (ignoreNextSeek) {

          ignoreNextSeek = false;

          return;
        }

        if (
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }

        socket.send(
          JSON.stringify({
            type: "seek",
            position:
              video.currentTime
          })
        );
      }
    );

    /*
     * Initialize Viewer mode.
     */
    updateControls();

    /*
     * Start WebSocket connection.
     */
    connect();
  </script>

</body>
</html>
