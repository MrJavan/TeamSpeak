<body>

  <div class="container">

    <h1>Watch Party</h1>

    <video
      id="video"
      controls
      autoplay
      muted
      playsinline
    >

        type="video/mp4"
      >
    </video>

    <div id="status" class="status disconnected">
      Connecting...
    </div>

  </div>

  <script>
    const video = document.getElementById("video");
    const status = document.getElementById("status");

    const wsProtocol =
      location.protocol === "https:" ? "wss:" : "ws:";

    const wsUrl =
      `${wsProtocol}//movie.mrjavan.workers.dev`;

    let socket;

    // Prevent remote changes from being sent back to the server
    let applyingRemoteState = false;

    // Prevent the seeked event caused by synchronization
    // from being treated as a local seek
    let ignoreNextSeek = false;

    function connect() {
      socket = new WebSocket(wsUrl);

      socket.addEventListener("open", () => {
        status.textContent = "Connected";
        status.className = "status connected";
      });

      socket.addEventListener("close", () => {
        status.textContent =
          "Disconnected - reconnecting...";

        status.className =
          "status disconnected";

        setTimeout(connect, 2000);
      });

      socket.addEventListener("error", () => {
        status.textContent = "Connection error";
        status.className = "status disconnected";
      });

      socket.addEventListener("message", async (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.type !== "state") {
            return;
          }

          applyingRemoteState = true;

          const targetPosition =
            Number(data.position);

          // Synchronize playback position
          if (
            Math.abs(
              video.currentTime - targetPosition
            ) > 0.5
          ) {
            ignoreNextSeek = true;

            video.currentTime =
              targetPosition;
          }

          // Synchronize playback state
          if (data.playing) {

            // Muted autoplay is allowed by modern browsers
            video.muted = true;

            try {
              await video.play();
            } catch (error) {
              console.log(
                "Autoplay was blocked by the browser."
              );
            }

          } else {

            video.pause();

          }

          applyingRemoteState = false;

        } catch (error) {
          console.error(
            "Invalid server message:",
            error
          );

          applyingRemoteState = false;
        }
      });
    }

    // Local Play
    video.addEventListener("play", () => {

      if (
        applyingRemoteState ||
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      socket.send(
        JSON.stringify({
          type: "play",
          position: video.currentTime
        })
      );
    });

    // Local Pause
    video.addEventListener("pause", () => {

      if (
        applyingRemoteState ||
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      socket.send(
        JSON.stringify({
          type: "pause",
          position: video.currentTime
        })
      );
    });

    // Local Seek
    video.addEventListener("seeked", () => {

      // Ignore seeks caused by synchronization
      if (applyingRemoteState) {
        return;
      }

      if (ignoreNextSeek) {
        ignoreNextSeek = false;
        return;
      }

      if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      socket.send(
        JSON.stringify({
          type: "seek",
          position: video.currentTime
        })
      );
    });

    // Connect to Watch Party server
    connect();
  </script>
