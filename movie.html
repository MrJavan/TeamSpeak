<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Party</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      max-height: 600px;
      background: #000;
      display: block;
    }

    .info {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .status,
    .viewers,
    .role {
      padding: 10px 14px;
      background: #222;
      border-radius: 6px;
      font-size: 14px;
    }

    .viewers {
      color: #fff;
    }

    .role {
      color: #fff;
    }

    .connected {
      color: #4caf50;
    }

    .disconnected {
      color: #f44336;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Watch Party</h1>

    <video
      id="video"
      controls
      autoplay
      muted
      playsinline
    >
      <source
        src="https://coderhub.s3.ir-thr-at1.arvanstorage.ir/621b9bbd91f4f19ec8ad3fc88247421272733062-480p.mp4"
        type="video/mp4"
      >
    </video>

    <div class="info">

      <div
        id="status"
        class="status disconnected"
      >
        Connecting...
      </div>

      <div
        id="viewers"
        class="viewers"
      >
        👁 0 viewers
      </div>

      <div
        id="role"
        class="role"
      >
        Role: Viewer
      </div>

    </div>

  </div>

  <script>
    const video = document.getElementById("video");
    const status = document.getElementById("status");
    const viewers = document.getElementById("viewers");
    const roleElement = document.getElementById("role");

    const wsProtocol =
      location.protocol === "https:" ? "wss:" : "ws:";

    /*
     * Host token is passed through the URL.
     *
     * Example:
     * ?token=YOUR_HOST_TOKEN
     */
    const pageUrl = new URL(window.location.href);
    const hostToken = pageUrl.searchParams.get("token");

    let wsUrl =
      `${wsProtocol}//movie.mrjavan.workers.dev`;

    if (hostToken) {
      wsUrl += `?token=${encodeURIComponent(hostToken)}`;
    }

    let socket;

    // True when this browser is the Host
    let isHost = false;

    // Prevent remote changes from being sent back
    let applyingRemoteState = false;

    // Prevent synchronization seeks from being sent back
    let ignoreNextSeek = false;

    // Prevent local events before initial synchronization
    let initialStateReceived = false;

    /*
     * Viewer controls are disabled until the server
     * confirms the user's role.
     */
    function updateControls() {
      if (isHost) {
        video.controls = true;
        roleElement.textContent = "Role: Host";
      } else {
        video.controls = false;
        roleElement.textContent = "Role: Viewer";
      }
    }

    /*
     * Force Viewer back to the server state.
     *
     * This protects against attempts to control the video
     * through browser JavaScript or other local methods.
     */
    function enforceViewerState(playing, position) {
      if (isHost) {
        return;
      }

      applyingRemoteState = true;

      if (
        Math.abs(
          video.currentTime - position
        ) > 0.2
      ) {
        ignoreNextSeek = true;
        video.currentTime = position;
      }

      if (playing) {
        video.play().catch(() => {
          console.log(
            "Viewer autoplay was blocked by the browser."
          );
        });
      } else {
        video.pause();
      }

      applyingRemoteState = false;
    }

    function connect() {
      socket = new WebSocket(wsUrl);

      socket.addEventListener("open", () => {
        status.textContent = "Connected";
        status.className = "status connected";
      });

      socket.addEventListener("close", () => {
        status.textContent =
          "Disconnected - reconnecting...";

        status.className =
          "status disconnected";

        setTimeout(connect, 2000);
      });

      socket.addEventListener("error", () => {
        status.textContent =
          "Connection error";

        status.className =
          "status disconnected";
      });

      socket.addEventListener("message", async (event) => {
        try {
          const data = JSON.parse(event.data);

          /*
           * Role update
           */
          if (data.type === "role") {
            isHost = data.isHost === true;

            updateControls();

            return;
          }

          /*
           * Viewer count update
           */
          if (data.type === "viewers") {
            const count = Number(data.count);

            viewers.textContent =
              `👁 ${count} ${
                count === 1
                  ? "viewer"
                  : "viewers"
              }`;

            return;
          }

          /*
           * Movie state update
           */
          if (data.type !== "state") {
            return;
          }

          const targetPosition =
            Number(data.position);

          applyingRemoteState = true;

          /*
           * Synchronize position
           */
          if (
            Math.abs(
              video.currentTime -
              targetPosition
            ) > 0.5
          ) {
            ignoreNextSeek = true;

            video.currentTime =
              targetPosition;
          }

          /*
           * Synchronize playback
           */
          if (data.playing) {

            /*
             * Only use muted autoplay for the
             * initial synchronization.
             */
            if (!initialStateReceived) {
              video.muted = true;
            }

            try {
              await video.play();
            } catch (error) {
              console.log(
                "Autoplay was blocked by the browser."
              );
            }

          } else {

            video.pause();

          }

          initialStateReceived = true;

          applyingRemoteState = false;

        } catch (error) {

          console.error(
            "Invalid server message:",
            error
          );

          applyingRemoteState = false;
        }
      });
    }

    /*
     * Local Play
     *
     * Only Host is allowed to send this command.
     */
    video.addEventListener("play", () => {

      if (!initialStateReceived) {
        return;
      }

      if (!isHost) {
        return;
      }

      if (
        applyingRemoteState ||
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      socket.send(
        JSON.stringify({
          type: "play",
          position: video.currentTime
        })
      );
    });

    /*
     * Local Pause
     *
     * Only Host is allowed to send this command.
     */
    video.addEventListener("pause", () => {

      if (!initialStateReceived) {
        return;
      }

      if (!isHost) {
        return;
      }

      if (
        applyingRemoteState ||
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      socket.send(
        JSON.stringify({
          type: "pause",
          position: video.currentTime
        })
      );
    });

    /*
     * Local Seek
     *
     * Only Host is allowed to send this command.
     */
    video.addEventListener("seeked", () => {

      if (!initialStateReceived) {
        return;
      }

      if (!isHost) {
        return;
      }

      if (applyingRemoteState) {
        return;
      }

      if (ignoreNextSeek) {
        ignoreNextSeek = false;
        return;
      }

      if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      socket.send(
        JSON.stringify({
          type: "seek",
          position: video.currentTime
        })
      );
    });

    /*
     * Viewer protection:
     *
     * If a Viewer somehow changes the video locally,
     * restore the last server state when possible.
     */
    video.addEventListener("play", () => {

      if (
        !isHost &&
        initialStateReceived &&
        !applyingRemoteState
      ) {
        video.pause();
      }
    });

    video.addEventListener("pause", () => {

      if (
        !isHost &&
        initialStateReceived &&
        !applyingRemoteState
      ) {
        // Server will send the correct state again.
      }
    });

    video.addEventListener("seeking", () => {

      if (
        !isHost &&
        initialStateReceived &&
        !applyingRemoteState
      ) {
        // Prevent Viewer from changing the timeline.
        video.currentTime = video.currentTime;
      }
    });

    // Start connection
    updateControls();
    connect();
  </script>

</body>
</html>
