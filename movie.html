<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Party</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .video-container {
      position: relative;
      width: 100%;
    }

    video {
      width: 100%;
      max-height: 600px;
      background: #000;
      display: block;
    }

    .mute-button {
      position: absolute;
      right: 15px;
      bottom: 15px;

      width: 45px;
      height: 45px;

      border: none;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.75);
      color: #fff;

      font-size: 20px;
      cursor: pointer;

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 10;
    }

    .mute-button:hover {
      background: rgba(0, 0, 0, 0.9);
    }

    .info {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .status,
    .viewers,
    .role {
      padding: 10px 14px;
      background: #222;
      border-radius: 6px;
      font-size: 14px;
    }

    .connected {
      color: #4caf50;
    }

    .disconnected {
      color: #f44336;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Watch Party</h1>

    <div class="video-container">

      <video
        id="video"
        autoplay
        muted
        playsinline
      >
        <source
          src="https://coderhub.s3.ir-thr-at1.arvanstorage.ir/621b9bbd91f4f19ec8ad3fc88247421272733062-480p.mp4"
          type="video/mp4"
        >
      </video>

      <button
        id="muteButton"
        class="mute-button"
        type="button"
        aria-label="Mute"
      >
        🔇
      </button>

    </div>

    <div class="info">

      <div
        id="status"
        class="status disconnected"
      >
        Connecting...
      </div>

      <div
        id="viewers"
        class="viewers"
      >
        👁 0 viewers
      </div>

      <div
        id="role"
        class="role"
      >
        Role: Viewer
      </div>

    </div>

  </div>

  <script>
    const video =
      document.getElementById("video");

    const status =
      document.getElementById("status");

    const viewers =
      document.getElementById("viewers");

    const roleElement =
      document.getElementById("role");

    const muteButton =
      document.getElementById("muteButton");

    /*
     * WebSocket protocol.
     */
    const wsProtocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    /*
     * Get Host token from URL.
     */
    const pageUrl =
      new URL(window.location.href);

    const hostToken =
      pageUrl.searchParams.get("token");

    /*
     * Build WebSocket URL.
     */
    let wsUrl =
      `${wsProtocol}//movie.mrjavan.workers.dev`;

    if (hostToken) {
      wsUrl +=
        `?token=${encodeURIComponent(hostToken)}`;
    }

    let socket = null;

    /*
     * Current user's role.
     */
    let isHost = false;

    /*
     * Prevent local events from being
     * sent while applying server state.
     */
    let applyingRemoteState = false;

    /*
     * Prevent synchronized seek events
     * from being sent back to the server.
     */
    let ignoreNextSeek = false;

    /*
     * Prevent local events before
     * receiving the initial server state.
     *
     * This is especially important after
     * refreshing the page.
     */
    let initialStateReceived = false;

    /*
     * Store the latest server state.
     */
    let lastServerState = null;

    /*
     * Track whether the video has finished
     * its initial synchronization.
     */
    let videoSynchronized = false;

    /*
     * Check whether the video is ready.
     */
    function videoIsReady() {

      return (
        video.readyState >= 3
      );
    }

    /*
     * Update mute button icon.
     */
    function updateMuteButton() {

      if (video.muted) {

        muteButton.textContent = "🔇";

        muteButton.setAttribute(
          "aria-label",
          "Unmute"
        );

      } else {

        muteButton.textContent = "🔊";

        muteButton.setAttribute(
          "aria-label",
          "Mute"
        );
      }
    }

    /*
     * Update controls based on role.
     */
    function updateControls() {

      if (isHost) {

        /*
         * Host gets native video controls.
         */
        video.controls = true;

        /*
         * Hide custom mute button for Host.
         */
        muteButton.style.display = "none";

        roleElement.textContent =
          "Role: Host";

      } else {

        /*
         * Viewers cannot control playback.
         */
        video.controls = false;

        /*
         * Viewer only gets mute/unmute.
         */
        muteButton.style.display = "flex";

        roleElement.textContent =
          "Role: Viewer";
      }

      updateMuteButton();
    }

    /*
     * Apply the latest server state.
     *
     * IMPORTANT:
     * This function never sends a control
     * command back to the server.
     */
    async function applyServerState() {

      if (!lastServerState) {
        return;
      }

      /*
       * Do not synchronize until the video
       * has enough data.
       */
      if (!videoIsReady()) {
        return;
      }

      const playing =
        lastServerState.playing;

      const position =
        lastServerState.position;

      applyingRemoteState = true;

      try {

        /*
         * Synchronize position.
         */
        if (
          Math.abs(
            video.currentTime - position
          ) > 0.5
        ) {

          /*
           * Ignore the seek event caused by
           * changing currentTime ourselves.
           */
          ignoreNextSeek = true;

          try {

            video.currentTime =
              position;

          } catch (error) {

            console.log(
              "Unable to set video position."
            );
          }
        }

        /*
         * Viewers must remain muted during
         * the first synchronization so that
         * browser autoplay restrictions do
         * not stop playback.
         *
         * After the first sync, do NOT force
         * mute again. This means if the Viewer
         * manually unmutes, a later server
         * update will not mute them again.
         */
        if (
          !isHost &&
          !videoSynchronized
        ) {

          video.muted = true;

          updateMuteButton();
        }

        /*
         * Synchronize playback state.
         */
        if (playing) {

          try {

            await video.play();

          } catch (error) {

            console.log(
              "Playback will retry when video is ready."
            );
          }

        } else {

          video.pause();
        }

        /*
         * The video is now synchronized.
         */
        videoSynchronized = true;

        initialStateReceived = true;

      } finally {

        /*
         * Wait until all browser-generated
         * events caused by synchronization
         * have finished.
         */
        setTimeout(() => {

          applyingRemoteState = false;

        }, 0);
      }
    }

    /*
     * When video becomes ready,
     * apply the latest server state.
     */
    video.addEventListener(
      "canplay",
      () => {

        if (!lastServerState) {
          return;
        }

        applyServerState();
      }
    );

    /*
     * Also retry after metadata is loaded.
     */
    video.addEventListener(
      "loadedmetadata",
      () => {

        if (!lastServerState) {
          return;
        }

        applyServerState();
      }
    );

    /*
     * Connect to Watch Party server.
     */
    function connect() {

      socket =
        new WebSocket(wsUrl);

      socket.addEventListener(
        "open",
        () => {

          status.textContent =
            "Connected";

          status.className =
            "status connected";
        }
      );

      socket.addEventListener(
        "close",
        () => {

          status.textContent =
            "Disconnected - reconnecting...";

          status.className =
            "status disconnected";

          /*
           * The next server state after
           * reconnect must be treated as
           * a fresh synchronization.
           */
          initialStateReceived = false;
          videoSynchronized = false;

          setTimeout(
            connect,
            2000
          );
        }
      );

      socket.addEventListener(
        "error",
        () => {

          status.textContent =
            "Connection error";

          status.className =
            "status disconnected";
        }
      );

      socket.addEventListener(
        "message",
        async (event) => {

          try {

            const data =
              JSON.parse(event.data);

            /*
             * Role update.
             */
            if (
              data.type === "role"
            ) {

              isHost =
                data.isHost === true;

              updateControls();

              /*
               * If state has already arrived,
               * synchronize again after knowing
               * the user's role.
               */
              if (lastServerState) {

                await applyServerState();
              }

              return;
            }

            /*
             * Viewer count update.
             */
            if (
              data.type === "viewers"
            ) {

              const count =
                Number(data.count);

              viewers.textContent =
                `👁 ${count} ${
                  count === 1
                    ? "viewer"
                    : "viewers"
                }`;

              return;
            }

            /*
             * Movie state update.
             */
            if (
              data.type !== "state"
            ) {
              return;
            }

            /*
             * Save server state.
             *
             * Do not immediately send anything
             * back to the server.
             */
            lastServerState = {
              playing:
                data.playing === true,

              position:
                Number(data.position)
            };

            /*
             * Apply server state locally.
             */
            await applyServerState();

          } catch (error) {

            console.error(
              "Invalid server message:",
              error
            );

            applyingRemoteState = false;
          }
        }
      );
    }

    /*
     * Host Play.
     */
    video.addEventListener(
      "play",
      () => {

        /*
         * Ignore browser autoplay and
         * synchronization events.
         */
        if (
          !initialStateReceived ||
          applyingRemoteState
        ) {
          return;
        }

        /*
         * Viewers never send control commands.
         */
        if (!isHost) {
          return;
        }

        if (
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }

        socket.send(
          JSON.stringify({
            type: "play",
            position:
              video.currentTime
          })
        );
      }
    );

    /*
     * Host Pause.
     */
    video.addEventListener(
      "pause",
      () => {

        /*
         * Ignore browser autoplay and
         * synchronization events.
         */
        if (
          !initialStateReceived ||
          applyingRemoteState
        ) {
          return;
        }

        /*
         * Viewers never send control commands.
         */
        if (!isHost) {
          return;
        }

        if (
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }

        socket.send(
          JSON.stringify({
            type: "pause",
            position:
              video.currentTime
          })
        );
      }
    );

    /*
     * Host Seek.
     *
     * Seeking pauses the movie for everyone.
     */
    video.addEventListener(
      "seeked",
      () => {

        /*
         * Ignore events before the first
         * server synchronization.
         */
        if (
          !initialStateReceived ||
          applyingRemoteState
        ) {
          return;
        }

        /*
         * Viewers cannot seek.
         */
        if (!isHost) {
          return;
        }

        /*
         * Ignore the seek event generated
         * by server synchronization.
         */
        if (ignoreNextSeek) {

          ignoreNextSeek = false;

          return;
        }

        if (
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }

        socket.send(
          JSON.stringify({
            type: "seek",
            position:
              video.currentTime
          })
        );
      }
    );

    /*
     * Viewer-only mute/unmute.
     *
     * This is completely local and does
     * NOT affect other users.
     */
    muteButton.addEventListener(
      "click",
      () => {

        video.muted =
          !video.muted;

        updateMuteButton();
      }
    );

    /*
     * Initialize Viewer mode.
     */
    updateControls();

    /*
     * Start WebSocket connection.
     */
    connect();
  </script>

</body>
</html>
