<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Party</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .video-container {
      position: relative;
      width: 100%;
    }

    video {
      width: 100%;
      min-height: 300px;
      max-height: 600px;
      background: #000;
      display: block;
    }

    .no-video-message {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
      text-align: center;

      color: #aaa;
      font-size: 15px;

      pointer-events: none;
    }

    .mute-button {
      position: absolute;
      right: 15px;
      bottom: 15px;

      width: 45px;
      height: 45px;

      border: none;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.75);
      color: #fff;

      font-size: 20px;
      cursor: pointer;

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 10;
    }

    .mute-button:hover {
      background: rgba(0, 0, 0, 0.9);
    }

    .time-display {
      position: absolute;
      left: 15px;
      bottom: 15px;

      padding: 6px 12px;

      border-radius: 6px;

      background: rgba(0, 0, 0, 0.75);
      color: #fff;

      font-size: 13px;
      font-variant-numeric: tabular-nums;

      display: none;
      align-items: center;

      z-index: 10;

      pointer-events: none;
      user-select: none;
    }

    .info {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .status,
    .viewers,
    .role {
      padding: 10px 14px;
      background: #222;
      border-radius: 6px;
      font-size: 14px;
    }

    .host-controls {
      display: none;
      gap: 10px;
      margin-top: 15px;
    }

    .video-url-input {
      flex: 1;

      padding: 10px 14px;

      border: 1px solid #333;
      border-radius: 6px;

      background: #1a1a1a;
      color: #fff;

      font-size: 14px;
      direction: ltr;
      text-align: left;
    }

    .video-url-input::placeholder {
      color: #888;
    }

    .set-video-button {
      padding: 10px 18px;

      border: none;
      border-radius: 6px;

      background: #4caf50;
      color: #fff;

      font-size: 14px;
      cursor: pointer;
    }

    .set-video-button:hover {
      background: #439a46;
    }

    .connected {
      color: #4caf50;
    }

    .disconnected {
      color: #f44336;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Watch Party</h1>

    <div class="video-container">

      <video
        id="video"
        playsinline
        preload="auto"
        muted
      ></video>

      <div
        id="noVideoMessage"
        class="no-video-message"
      >
        هنوز فیلمی توسط میزبان تنظیم نشده است
      </div>

      <button
        id="muteButton"
        class="mute-button"
        type="button"
        aria-label="Mute"
      >
        🔇
      </button>

      <div
        id="timeDisplay"
        class="time-display"
      >
        00:00 / 00:00
      </div>

    </div>

    <div
      id="hostControls"
      class="host-controls"
    >
      <input
        id="videoUrlInput"
        class="video-url-input"
        type="url"
        placeholder="Mp4 Url Here..."
      >

      <button
        id="setVideoButton"
        class="set-video-button"
        type="button"
      >
        Play
      </button>
    </div>

    <div class="info">

      <div
        id="status"
        class="status disconnected"
      >
        Connecting...
      </div>

      <div
        id="viewers"
        class="viewers"
      >
        👁 0 viewers
      </div>

      <div
        id="role"
        class="role"
      >
        Role: Viewer
      </div>

    </div>

  </div>

  <script>
    const video =
      document.getElementById("video");

    const status =
      document.getElementById("status");

    const viewers =
      document.getElementById("viewers");

    const roleElement =
      document.getElementById("role");

    const muteButton =
      document.getElementById("muteButton");

    const timeDisplay =
      document.getElementById("timeDisplay");

    const noVideoMessage =
      document.getElementById("noVideoMessage");

    const hostControls =
      document.getElementById("hostControls");

    const videoUrlInput =
      document.getElementById("videoUrlInput");

    const setVideoButton =
      document.getElementById("setVideoButton");


    /*
     * WebSocket protocol.
     */
    const wsProtocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";


    /*
     * Get Host token from URL.
     */
    const pageUrl =
      new URL(window.location.href);

    const hostToken =
      pageUrl.searchParams.get("token");


    /*
     * Build WebSocket URL.
     */
    let wsUrl =
      `${wsProtocol}//movie.mrjavan.workers.dev`;

    if (hostToken) {

      wsUrl +=
        `?token=${encodeURIComponent(hostToken)}`;
    }


    let socket = null;


    /*
     * Heartbeat: periodically ping the server so it
     * knows this connection is still alive, even if
     * the network drops without a clean close.
     */
    let heartbeatIntervalId = null;

    const HEARTBEAT_INTERVAL_MS = 15000;


    function startHeartbeat() {

      stopHeartbeat();

      heartbeatIntervalId =
        setInterval(() => {

          if (
            socket &&
            socket.readyState === WebSocket.OPEN
          ) {

            socket.send(
              JSON.stringify({
                type: "ping"
              })
            );
          }

        }, HEARTBEAT_INTERVAL_MS);
    }


    function stopHeartbeat() {

      if (heartbeatIntervalId) {

        clearInterval(heartbeatIntervalId);

        heartbeatIntervalId = null;
      }
    }


    /*
     * Current user's role.
     */
    let isHost = false;


    /*
     * Server state.
     */
    let lastServerState = null;


    /*
     * Server messages.
     */
    let stateReceived = false;
    let roleReceived = false;


    /*
     * Initial synchronization finished.
     */
    let synchronizedWithServer = false;


    /*
     * Prevent local events during
     * synchronization.
     */
    let applyingRemoteState = false;


    /*
     * Ignore seek events generated
     * by synchronization.
     */
    let ignoreNextSeek = false;


    /*
     * Prevent multiple sync operations.
     */
    let syncInProgress = false;


    /*
     * If a new state arrives while a sync is already
     * in progress, remember to run another sync right
     * after the current one finishes instead of just
     * dropping the update.
     */
    let pendingResync = false;


    /*
     * Whether we've already attempted the very first
     * playback for this page load. Browsers only need
     * autoplay to start muted; that permission is tied
     * to the page, not to any one sync, so this must NOT
     * reset on reconnects (unlike synchronizedWithServer),
     * or a viewer who already unmuted would get muted
     * again after every brief network hiccup.
     */
    let hasAttemptedAutoplay = false;


    /*
     * The video URL currently loaded, as
     * received from the server. Used to
     * detect when the host changes it.
     */
    let currentVideoUrl = null;


    /*
     * When lastServerState was received, so we can
     * estimate the "live" expected position later
     * (e.g. after the host's tab was backgrounded).
     */
    let lastServerStateReceivedAt = null;


    /*
     * Estimate where playback should be right now,
     * based on the last known server state and how
     * much time has passed since we received it.
     */
    function getEstimatedServerPosition() {

      if (!lastServerState) {
        return 0;
      }

      if (!lastServerState.playing) {
        return lastServerState.position;
      }

      const elapsed =
        (Date.now() - lastServerStateReceivedAt) / 1000;

      return (
        lastServerState.position + elapsed
      );
    }


    /*
     * Check if video has enough data.
     */
    function videoIsReady() {

      return (
        video.readyState >= 2
      );
    }


    /*
     * Update mute button.
     */
    function updateMuteButton() {

      if (video.muted) {

        muteButton.textContent =
          "🔇";

        muteButton.setAttribute(
          "aria-label",
          "Unmute"
        );

      } else {

        muteButton.textContent =
          "🔊";

        muteButton.setAttribute(
          "aria-label",
          "Mute"
        );
      }
    }


    /*
     * Format seconds as mm:ss (or h:mm:ss
     * for videos over an hour).
     */
    function formatTime(totalSeconds) {

      if (
        !isFinite(totalSeconds) ||
        totalSeconds < 0
      ) {
        totalSeconds = 0;
      }

      const hours =
        Math.floor(totalSeconds / 3600);

      const minutes =
        Math.floor((totalSeconds % 3600) / 60);

      const seconds =
        Math.floor(totalSeconds % 60);

      const pad =
        (n) => String(n).padStart(2, "0");

      if (hours > 0) {

        return (
          `${hours}:${pad(minutes)}:${pad(seconds)}`
        );
      }

      return (
        `${pad(minutes)}:${pad(seconds)}`
      );
    }


    /*
     * Update the read-only time display.
     *
     * Purely visual, cannot be interacted
     * with by the viewer.
     */
    function updateTimeDisplay() {

      const current =
        formatTime(video.currentTime);

      const duration =
        formatTime(video.duration);

      timeDisplay.textContent =
        `${current} / ${duration}`;
    }


    /*
     * Update UI based on role.
     */
    function updateControls() {

      if (isHost) {

        video.controls = true;

        muteButton.style.display =
          "none";

        timeDisplay.style.display =
          "none";

        hostControls.style.display =
          "flex";

        roleElement.textContent =
          "Role: Host";

      } else {

        video.controls = false;

        muteButton.style.display =
          "flex";

        timeDisplay.style.display =
          "flex";

        hostControls.style.display =
          "none";

        roleElement.textContent =
          "Role: Viewer";
      }

      updateMuteButton();

      updateTimeDisplay();
    }


    /*
     * Start playback safely.
     *
     * This is especially important for
     * Viewers because browsers can block
     * autoplay with sound.
     */
    async function startPlayback() {

      if (!lastServerState) {
        return;
      }

      if (!lastServerState.playing) {
        return;
      }


      /*
       * Only force-mute on the very first playback
       * attempt of this page load (before initial sync).
       * After that, respect the viewer's own mute/unmute
       * choice — this must survive reconnects, so it does
       * NOT depend on synchronizedWithServer.
       */
      if (!isHost && !hasAttemptedAutoplay) {

        video.muted = true;

        updateMuteButton();

        hasAttemptedAutoplay = true;
      }


      try {

        await video.play();

        return true;

      } catch (error) {

        console.log(
          "Autoplay attempt failed."
        );

        /*
         * If unmuted playback was blocked by the
         * browser's autoplay policy, fall back to
         * muted playback so the video still plays.
         * The viewer can unmute manually again.
         */
        if (!isHost && !video.muted) {

          video.muted = true;

          updateMuteButton();

          try {

            await video.play();

            return true;

          } catch (fallbackError) {

            console.log(
              "Muted fallback also failed."
            );
          }
        }

        return false;
      }
    }


    /*
     * Retry playback a few times.
     *
     * Sometimes the browser has not
     * completely prepared the media yet.
     */
    function retryPlayback() {

      if (!lastServerState) {
        return;
      }

      if (!lastServerState.playing) {
        return;
      }

      if (video.paused) {

        startPlayback();

        setTimeout(() => {

          if (
            lastServerState &&
            lastServerState.playing &&
            video.paused
          ) {

            startPlayback();
          }

        }, 500);

        setTimeout(() => {

          if (
            lastServerState &&
            lastServerState.playing &&
            video.paused
          ) {

            startPlayback();
          }

        }, 1500);
      }
    }


    /*
     * Apply a (possibly new) video URL coming
     * from the server. Only reloads the <video>
     * element when the URL actually changed.
     */
    function applyVideoUrl(url) {

      if (url === currentVideoUrl) {
        return false;
      }

      currentVideoUrl = url;

      /*
       * A video change means any previous
       * synchronization no longer applies.
       */
      synchronizedWithServer = false;

      if (url) {

        video.pause();

        video.src = url;

        video.load();

        noVideoMessage.style.display =
          "none";

      } else {

        video.pause();

        video.removeAttribute("src");

        video.load();

        noVideoMessage.style.display =
          "flex";
      }

      if (isHost) {

        videoUrlInput.value =
          url || "";
      }

      return true;
    }


    /*
     * Synchronize video with server.
     */
    async function synchronizeVideo() {

      /*
       * Need both role and state.
       */
      if (
        !stateReceived ||
        !roleReceived ||
        !lastServerState
      ) {
        return;
      }


      if (syncInProgress) {
        pendingResync = true;
        return;
      }


      if (!videoIsReady()) {
        return;
      }


      syncInProgress = true;

      applyingRemoteState = true;


      const position =
        lastServerState.position;

      const playing =
        lastServerState.playing;


      try {

        /*
         * Set position.
         *
         * This is LOCAL ONLY.
         */
        if (
          Math.abs(
            video.currentTime - position
          ) > 0.3
        ) {

          ignoreNextSeek = true;

          try {

            video.currentTime =
              position;

          } catch (error) {

            console.log(
              "Unable to set video position."
            );
          }
        }


        /*
         * Apply playback state.
         *
         * Muting on first playback (and the muted
         * fallback) is handled inside startPlayback().
         */
        if (playing) {

          /*
           * Wait for playback attempt.
           */
          await startPlayback();

        } else {

          /*
           * Server says paused.
           */
          video.pause();
        }


        /*
         * Synchronization completed.
         */
        synchronizedWithServer = true;


      } finally {

        /*
         * Keep protection active briefly
         * so browser-generated events from
         * synchronization cannot reach server.
         */
        setTimeout(() => {

          applyingRemoteState = false;
          syncInProgress = false;


          /*
           * A newer state arrived while we were busy —
           * run it now instead of leaving the client
           * out of sync until some other event happens.
           */
          if (pendingResync) {

            pendingResync = false;

            synchronizeVideo();
          }

        }, 150);
      }


      /*
       * If playback did not start,
       * retry automatically.
       */
      if (playing && video.paused) {

        retryPlayback();
      }
    }


    /*
     * Video events that indicate the media
     * is becoming ready.
     */
    video.addEventListener(
      "loadedmetadata",
      () => {

        synchronizeVideo();
      }
    );


    video.addEventListener(
      "loadeddata",
      () => {

        synchronizeVideo();
      }
    );


    video.addEventListener(
      "canplay",
      () => {

        synchronizeVideo();
      }
    );


    video.addEventListener(
      "canplaythrough",
      () => {

        synchronizeVideo();
      }
    );


    /*
     * Keep the read-only time display current.
     */
    video.addEventListener(
      "timeupdate",
      updateTimeDisplay
    );

    video.addEventListener(
      "loadedmetadata",
      updateTimeDisplay
    );

    video.addEventListener(
      "durationchange",
      updateTimeDisplay
    );


    /*
     * Connect to Watch Party server.
     */
    function connect() {

      socket =
        new WebSocket(wsUrl);


      socket.addEventListener(
        "open",
        () => {

          status.textContent =
            "Connected";

          status.className =
            "status connected";

          startHeartbeat();
        }
      );


      socket.addEventListener(
        "close",
        () => {

          status.textContent =
            "Disconnected - reconnecting...";

          status.className =
            "status disconnected";


          stopHeartbeat();


          /*
           * Reset synchronization state.
           *
           * Nothing is sent to the server.
           */
          stateReceived = false;
          roleReceived = false;
          synchronizedWithServer = false;

          syncInProgress = false;
          applyingRemoteState = false;


          setTimeout(
            connect,
            2000
          );
        }
      );


      socket.addEventListener(
        "error",
        () => {

          status.textContent =
            "Connection error";

          status.className =
            "status disconnected";
        }
      );


      socket.addEventListener(
        "message",
        async (event) => {

          try {

            const data =
              JSON.parse(event.data);


            /*
             * Role message.
             */
            if (
              data.type === "role"
            ) {

              isHost =
                data.isHost === true;

              roleReceived = true;

              updateControls();


              /*
               * The "state" message (which carries
               * videoUrl) is sent before "role", so if
               * we've just learned we're the host, make
               * sure the input field reflects whatever
               * video URL was already received.
               */
              if (isHost) {

                videoUrlInput.value =
                  currentVideoUrl || "";
              }


              /*
               * State may have arrived first.
               */
              await synchronizeVideo();

              return;
            }


            /*
             * Viewer count.
             */
            if (
              data.type === "viewers"
            ) {

              const count =
                Number(data.count);

              viewers.textContent =
                `👁 ${count} ${
                  count === 1
                    ? "viewer"
                    : "viewers"
                }`;

              return;
            }


            /*
             * Movie state.
             */
            if (
              data.type === "state"
            ) {

              /*
               * Handle a video URL change first
               * (this may reset synchronizedWithServer).
               */
              applyVideoUrl(
                data.videoUrl || null
              );


              lastServerState = {

                playing:
                  data.playing === true,

                position:
                  Number(data.position)

              };

              lastServerStateReceivedAt =
                Date.now();


              stateReceived = true;


              /*
               * Synchronize only.
               *
               * Never send anything back.
               */
              await synchronizeVideo();

              return;
            }

          } catch (error) {

            console.error(
              "Invalid server message:",
              error
            );

            applyingRemoteState = false;
            syncInProgress = false;
          }
        }
      );
    }


    /*
     * Host Play.
     */
    video.addEventListener(
      "play",
      () => {

        /*
         * Ignore anything generated by
         * initial loading or synchronization.
         */
        if (
          !synchronizedWithServer ||
          applyingRemoteState ||
          !isHost
        ) {
          return;
        }


        if (
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }


        socket.send(
          JSON.stringify({
            type: "play",
            position:
              video.currentTime
          })
        );
      }
    );


    /*
     * Host Pause.
     */
    video.addEventListener(
      "pause",
      () => {

        /*
         * Ignore anything generated by
         * initial loading or synchronization.
         */
        if (
          !synchronizedWithServer ||
          applyingRemoteState ||
          !isHost
        ) {
          return;
        }


        /*
         * Browsers often pause background-tab video
         * automatically to save power. That is not a
         * deliberate pause by the host, so don't tell
         * the server (and therefore the viewers) about
         * it — visibilitychange below will resume it
         * locally once the tab is visible again.
         */
        if (document.visibilityState !== "visible") {
          return;
        }


        if (
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }


        socket.send(
          JSON.stringify({
            type: "pause",
            position:
              video.currentTime
          })
        );
      }
    );


    /*
     * Host Seek.
     */
    video.addEventListener(
      "seeked",
      () => {

        /*
         * Ignore events before synchronization.
         */
        if (
          !synchronizedWithServer ||
          applyingRemoteState ||
          !isHost
        ) {
          return;
        }


        /*
         * Ignore seek caused by synchronization.
         */
        if (ignoreNextSeek) {

          ignoreNextSeek = false;

          return;
        }


        if (
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }


        socket.send(
          JSON.stringify({
            type: "seek",
            position:
              video.currentTime
          })
        );
      }
    );


    /*
     * Viewer mute/unmute.
     *
     * Completely local.
     */
    muteButton.addEventListener(
      "click",
      () => {

        video.muted =
          !video.muted;

        updateMuteButton();
      }
    );


    /*
     * Host sets a new video URL.
     */
    function submitVideoUrl() {

      if (!isHost) {
        return;
      }

      const url =
        videoUrlInput.value.trim();

      if (!url) {
        return;
      }

      if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      socket.send(
        JSON.stringify({
          type: "setVideo",
          url
        })
      );
    }


    setVideoButton.addEventListener(
      "click",
      submitVideoUrl
    );


    videoUrlInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          submitVideoUrl();
        }
      }
    );


    /*
     * Initialize UI.
     */
    updateControls();


    /*
     * Start WebSocket connection.
     */
    connect();


    /*
     * Close the connection cleanly on refresh/navigation
     * so the server can immediately update the viewer
     * count instead of waiting on the heartbeat timeout.
     */
    window.addEventListener(
      "beforeunload",
      () => {

        stopHeartbeat();

        if (socket) {

          socket.close();
        }
      }
    );


    /*
     * When the host returns to this tab, the browser may
     * have auto-paused the video while it was backgrounded
     * (that pause was never sent to the server — see the
     * "pause" listener above). Silently catch the host's
     * own video back up and resume it, without notifying
     * anyone; the server/viewers were never affected.
     */
    document.addEventListener(
      "visibilitychange",
      async () => {

        if (!isHost) {
          return;
        }

        if (document.visibilityState !== "visible") {
          return;
        }

        if (
          !lastServerState ||
          !lastServerState.playing
        ) {
          return;
        }

        if (!video.paused) {
          return;
        }

        if (!videoIsReady()) {
          return;
        }

        applyingRemoteState = true;

        ignoreNextSeek = true;

        const estimatedPosition =
          getEstimatedServerPosition();

        try {

          video.currentTime =
            estimatedPosition;

        } catch (error) {

          console.log(
            "Unable to resync position after returning to tab."
          );
        }

        try {

          await video.play();

        } catch (error) {

          console.log(
            "Resume after tab-switch failed."
          );

        } finally {

          setTimeout(() => {

            applyingRemoteState = false;

          }, 150);
        }


        /*
         * If playback still hasn't started
         * (e.g. the browser needed a moment
         * more), retry automatically instead
         * of leaving the host stuck paused.
         */
        if (video.paused) {

          retryPlayback();
        }
      }
    );

  </script>

</body>
</html>
