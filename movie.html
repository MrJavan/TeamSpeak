<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Party</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .video-container {
      position: relative;
      width: 100%;
    }

    video {
      width: 100%;
      max-height: 600px;
      background: #000;
      display: block;
    }

    .mute-button {
      position: absolute;
      right: 15px;
      bottom: 15px;

      width: 45px;
      height: 45px;

      border: none;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.75);
      color: #fff;

      font-size: 20px;
      cursor: pointer;

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 10;
    }

    .mute-button:hover {
      background: rgba(0, 0, 0, 0.9);
    }

    .info {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .status,
    .viewers,
    .role {
      padding: 10px 14px;
      background: #222;
      border-radius: 6px;
      font-size: 14px;
    }

    .connected {
      color: #4caf50;
    }

    .disconnected {
      color: #f44336;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Watch Party</h1>

    <div class="video-container">

      <video
        id="video"
        playsinline
        preload="auto"
      >
        <source
          src="https://coderhub.s3.ir-thr-at1.arvanstorage.ir/621b9bbd91f4f19ec8ad3fc88247421272733062-480p.mp4"
          type="video/mp4"
        >
      </video>

      <button
        id="muteButton"
        class="mute-button"
        type="button"
        aria-label="Mute"
      >
        🔇
      </button>

    </div>

    <div class="info">

      <div
        id="status"
        class="status disconnected"
      >
        Connecting...
      </div>

      <div
        id="viewers"
        class="viewers"
      >
        👁 0 viewers
      </div>

      <div
        id="role"
        class="role"
      >
        Role: Viewer
      </div>

    </div>

  </div>

  <script>
    const video =
      document.getElementById("video");

    const status =
      document.getElementById("status");

    const viewers =
      document.getElementById("viewers");

    const roleElement =
      document.getElementById("role");

    const muteButton =
      document.getElementById("muteButton");


    /*
     * WebSocket protocol.
     */
    const wsProtocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";


    /*
     * Get Host token from URL.
     */
    const pageUrl =
      new URL(window.location.href);

    const hostToken =
      pageUrl.searchParams.get("token");


    /*
     * Build WebSocket URL.
     */
    let wsUrl =
      `${wsProtocol}//movie.mrjavan.workers.dev`;

    if (hostToken) {
      wsUrl +=
        `?token=${encodeURIComponent(hostToken)}`;
    }


    let socket = null;


    /*
     * Current user's role.
     */
    let isHost = false;


    /*
     * Server state.
     */
    let lastServerState = null;


    /*
     * Server role has been received.
     */
    let roleReceived = false;


    /*
     * Server state has been received.
     */
    let stateReceived = false;


    /*
     * Video has completed its first
     * synchronization with the server.
     */
    let synchronizedWithServer = false;


    /*
     * Prevent local events while the
     * application is synchronizing.
     */
    let applyingRemoteState = false;


    /*
     * Ignore seek events caused by
     * setting currentTime ourselves.
     */
    let ignoreNextSeek = false;


    /*
     * Used to prevent multiple sync
     * operations from running at once.
     */
    let syncInProgress = false;


    /*
     * Check whether video is ready.
     */
    function videoIsReady() {

      return (
        video.readyState >= 2
      );
    }


    /*
     * Update mute icon.
     */
    function updateMuteButton() {

      if (video.muted) {

        muteButton.textContent =
          "🔇";

        muteButton.setAttribute(
          "aria-label",
          "Unmute"
        );

      } else {

        muteButton.textContent =
          "🔊";

        muteButton.setAttribute(
          "aria-label",
          "Mute"
        );
      }
    }


    /*
     * Update UI based on role.
     */
    function updateControls() {

      if (isHost) {

        /*
         * Host gets normal video controls.
         */
        video.controls = true;

        muteButton.style.display =
          "none";

        roleElement.textContent =
          "Role: Host";

      } else {

        /*
         * Viewers cannot control playback.
         */
        video.controls = false;

        muteButton.style.display =
          "flex";

        roleElement.textContent =
          "Role: Viewer";
      }

      updateMuteButton();
    }


    /*
     * Try to synchronize the video.
     *
     * IMPORTANT:
     *
     * This function does NOT send anything
     * to the server.
     *
     * It only applies the server state
     * locally.
     */
    async function synchronizeVideo() {

      /*
       * We need both state and role.
       */
      if (
        !stateReceived ||
        !roleReceived ||
        !lastServerState
      ) {
        return;
      }


      /*
       * Prevent multiple simultaneous
       * synchronization operations.
       */
      if (syncInProgress) {
        return;
      }


      /*
       * Wait until video has enough data.
       */
      if (!videoIsReady()) {
        return;
      }


      syncInProgress = true;
      applyingRemoteState = true;


      const playing =
        lastServerState.playing;

      const position =
        lastServerState.position;


      try {

        /*
         * Set the correct position first.
         */
        if (
          Math.abs(
            video.currentTime - position
          ) > 0.3
        ) {

          /*
           * This seek is generated by us,
           * not by the Host.
           */
          ignoreNextSeek = true;

          try {

            video.currentTime =
              position;

          } catch (error) {

            console.log(
              "Unable to set video position."
            );
          }
        }


        /*
         * Viewers start muted.
         *
         * This is only done during the
         * initial synchronization.
         */
        if (
          !isHost &&
          !synchronizedWithServer
        ) {

          video.muted = true;

          updateMuteButton();
        }


        /*
         * Apply playback state.
         */
        if (playing) {

          try {

            await video.play();

          } catch (error) {

            console.log(
              "Browser blocked autoplay."
            );

          }

        } else {

          video.pause();
        }


        /*
         * Synchronization completed.
         */
        synchronizedWithServer = true;

      } finally {

        /*
         * Keep event protection enabled
         * for one browser task after sync.
         *
         * This catches play/pause/seek events
         * generated by the synchronization itself.
         */
        setTimeout(() => {

          applyingRemoteState = false;
          syncInProgress = false;

        }, 100);
      }
    }


    /*
     * Try synchronization when video
     * becomes ready.
     */
    video.addEventListener(
      "loadedmetadata",
      () => {

        synchronizeVideo();
      }
    );


    video.addEventListener(
      "canplay",
      () => {

        synchronizeVideo();
      }
    );


    /*
     * Connect to Watch Party server.
     */
    function connect() {

      socket =
        new WebSocket(wsUrl);


      socket.addEventListener(
        "open",
        () => {

          status.textContent =
            "Connected";

          status.className =
            "status connected";
        }
      );


      socket.addEventListener(
        "close",
        () => {

          status.textContent =
            "Disconnected - reconnecting...";

          status.className =
            "status disconnected";


          /*
           * Reset synchronization state.
           *
           * IMPORTANT:
           * Do not send anything to the server.
           */
          stateReceived = false;
          roleReceived = false;
          synchronizedWithServer = false;
          syncInProgress = false;
          applyingRemoteState = false;


          setTimeout(
            connect,
            2000
          );
        }
      );


      socket.addEventListener(
        "error",
        () => {

          status.textContent =
            "Connection error";

          status.className =
            "status disconnected";
        }
      );


      socket.addEventListener(
        "message",
        async (event) => {

          try {

            const data =
              JSON.parse(event.data);


            /*
             * Role message.
             */
            if (
              data.type === "role"
            ) {

              isHost =
                data.isHost === true;

              roleReceived = true;

              updateControls();

              /*
               * State may have arrived before role.
               */
              await synchronizeVideo();

              return;
            }


            /*
             * Viewer count.
             */
            if (
              data.type === "viewers"
            ) {

              const count =
                Number(data.count);

              viewers.textContent =
                `👁 ${count} ${
                  count === 1
                    ? "viewer"
                    : "viewers"
                }`;

              return;
            }


            /*
             * Movie state.
             */
            if (
              data.type === "state"
            ) {

              lastServerState = {
                playing:
                  data.playing === true,

                position:
                  Number(data.position)
              };

              stateReceived = true;


              /*
               * Apply state only after
               * role is known too.
               */
              await synchronizeVideo();

              return;
            }

          } catch (error) {

            console.error(
              "Invalid server message:",
              error
            );

            applyingRemoteState = false;
            syncInProgress = false;
          }
        }
      );
    }


    /*
     * Host Play.
     *
     * No command can be sent before
     * synchronization is complete.
     */
    video.addEventListener(
      "play",
      () => {

        if (
          !synchronizedWithServer ||
          applyingRemoteState ||
          !isHost
        ) {
          return;
        }


        if (
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }


        socket.send(
          JSON.stringify({
            type: "play",
            position:
              video.currentTime
          })
        );
      }
    );


    /*
     * Host Pause.
     */
    video.addEventListener(
      "pause",
      () => {

        if (
          !synchronizedWithServer ||
          applyingRemoteState ||
          !isHost
        ) {
          return;
        }


        if (
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }


        socket.send(
          JSON.stringify({
            type: "pause",
            position:
              video.currentTime
          })
        );
      }
    );


    /*
     * Host Seek.
     *
     * Seeking pauses the movie for everyone.
     */
    video.addEventListener(
      "seeked",
      () => {

        /*
         * Ignore all seek events before
         * initial synchronization.
         */
        if (
          !synchronizedWithServer ||
          applyingRemoteState ||
          !isHost
        ) {
          return;
        }


        /*
         * Ignore seek caused by setting
         * currentTime during synchronization.
         */
        if (ignoreNextSeek) {

          ignoreNextSeek = false;

          return;
        }


        if (
          !socket ||
          socket.readyState !== WebSocket.OPEN
        ) {
          return;
        }


        socket.send(
          JSON.stringify({
            type: "seek",
            position:
              video.currentTime
          })
        );
      }
    );


    /*
     * Viewer mute/unmute.
     *
     * This is completely local.
     */
    muteButton.addEventListener(
      "click",
      () => {

        video.muted =
          !video.muted;

        updateMuteButton();
      }
    );


    /*
     * Initialize UI.
     */
    updateControls();


    /*
     * Start WebSocket connection.
     */
    connect();

  </script>

</body>
</html>
